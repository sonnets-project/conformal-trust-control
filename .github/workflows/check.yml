name: Public reproducibility checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-reproduce.txt pyarrow
      - run: python scripts/verify_release.py
      - run: python -m unittest discover -s tests -v
      - run: bash run_reproduction.sh --mode reference
